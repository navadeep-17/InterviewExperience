name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Check repository-owned backend JavaScript syntax
        run: |
          node -e 'const {execFileSync} = require("node:child_process"); const files = execFileSync("git", ["ls-files", "-z", "--", "*.js"], {encoding: "utf8"}).split("\0").filter(Boolean); for (const file of files) execFileSync(process.execPath, ["--check", file], {stdio: "inherit"}); console.log(`Checked ${files.length} backend JavaScript files`);'
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend/interviewhub
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: Frontend/interviewhub/package-lock.json
      - run: npm ci
      - run: npm run build
